name: academyjournal

# AcademyJournal self-hosted stack — single-tenant deploy on an Oracle Cloud
# Always Free VM (1 vCPU / 1GB RAM). Caddy terminates TLS itself (automatic
# Let's Encrypt certs for both hostnames), so no host nginx is needed —
# ports 80/443 are published directly.
#
# mem_limit values are sized for a 1GB VM (+2GB swap) so one container can't
# starve the others; they're generous enough for this app's normal load.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 128m
    mem_limit: 300m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [internal]
    # Intentionally NOT published to the host — reachable only on the internal network.

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    mem_limit: 350m
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_API_URL: https://${CANONICAL_API_DOMAIN}/api
    restart: unless-stopped
    mem_limit: 150m
    depends_on:
      - backend
    environment:
      - FRONTEND_DOMAIN=${FRONTEND_DOMAIN}
      - API_DOMAIN=${API_DOMAIN}
    volumes:
      - media:/media:ro          # serve user-uploaded media directly from Caddy
      - caddy_data:/data         # persisted TLS certs (survives rebuilds/restarts)
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    networks: [internal]

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
