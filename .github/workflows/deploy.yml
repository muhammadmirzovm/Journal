name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
          SECRET_KEY: ci-secret-key
          DEBUG: 'true'
        run: pytest users/tests.py groups/tests.py rewards/tests.py coins/tests.py games/tests.py purchases/tests.py quiz/tests.py academies/tests.py -v
        working-directory: backend

# Deployment itself is handled by Railway's native GitHub integration — it
# watches this repo directly and rebuilds backend/ and frontend/ on every
# push to main, no SSH step needed here. (The old Oracle/SSH deploy job
# lived here; removed since that server is no longer the deploy target —
# see DEPLOY.md's Oracle section if that path is ever revived.)
